name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_WORDPRESS_URL: https://ci-placeholder.invalid
  WORDPRESS_API_URL: https://ci-placeholder.invalid/wp-json/wp/v2
  WC_API_URL: https://ci-placeholder.invalid/wp-json/wc/v3
  WC_CONSUMER_KEY: ck_ci_placeholder
  WC_CONSUMER_SECRET: cs_ci_placeholder
  WP_APP_USER: ci
  WP_APP_PASSWORD: ci
  REVALIDATE_SECRET: ci-secret
  STRIPE_SECRET_KEY: sk_test_ci_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
  NEXT_PUBLIC_PAYPAL_CLIENT_ID: paypal-client-id
  PAYPAL_SECRET: paypal-secret
  PAYPAL_MODE: sandbox
  PAYPAL_WEBHOOK_ID: paypal-webhook-id
  FREE_SHIPPING_THRESHOLD: "50"
  DHL_PRICE_KLEINPAKET: "3.99"
  DHL_PRICE_PAKET: "5.49"
  DHL_PRICE_INTERNATIONAL: "8.99"

jobs:
  frontend:
    name: Frontend - Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Run frontend unit and API tests
        run: pnpm test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

      - name: Production build
        run: pnpm build
