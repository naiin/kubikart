name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - backend/wordpress/**
      - backend/scripts/**
      - backend/db/migrations/**
      - .github/workflows/deploy-backend.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
          STRATO_SSH_HOST: ${{ secrets.STRATO_SSH_HOST }}
          STRATO_SSH_USER: ${{ secrets.STRATO_SSH_USER }}
          STRATO_REMOTE_APP_DIR: ${{ secrets.STRATO_REMOTE_APP_DIR }}
          STRATO_DB_HOST: ${{ secrets.STRATO_DB_HOST }}
          STRATO_DB_NAME: ${{ secrets.STRATO_DB_NAME }}
          STRATO_DB_USER: ${{ secrets.STRATO_DB_USER }}
          STRATO_DB_PASS: ${{ secrets.STRATO_DB_PASS }}
          HAS_DB_MIGRATIONS: ${{ hashFiles('backend/db/migrations/*.sql') != '' }}
        run: |
          missing=0
          for name in \
            STRATO_SSH_PRIVATE_KEY \
            STRATO_SSH_HOST \
            STRATO_SSH_USER
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              missing=1
            fi
          done
          if [ "$HAS_DB_MIGRATIONS" = "true" ]; then
            for name in STRATO_DB_HOST STRATO_DB_NAME STRATO_DB_USER STRATO_DB_PASS
            do
              if [ -z "${!name:-}" ]; then
                echo "Missing required GitHub Actions secret: $name" >&2
                missing=1
              fi
            done
          fi
          exit "$missing"

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.STRATO_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend files
        env:
          DEPLOY_SSH_HOST: ${{ secrets.STRATO_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.STRATO_SSH_USER }}
          DEPLOY_REMOTE_APP_DIR: ${{ secrets.STRATO_REMOTE_APP_DIR }}
        run: |
          chmod +x backend/scripts/deploy-files.sh
          backend/scripts/deploy-files.sh

      - name: Apply DB migrations
        if: hashFiles('backend/db/migrations/*.sql') != ''
        env:
          DB_HOST: ${{ secrets.STRATO_DB_HOST }}
          DB_NAME: ${{ secrets.STRATO_DB_NAME }}
          DB_USER: ${{ secrets.STRATO_DB_USER }}
          DB_PASS: ${{ secrets.STRATO_DB_PASS }}
        run: |
          chmod +x backend/scripts/deploy-db-migrations.sh
          backend/scripts/deploy-db-migrations.sh
